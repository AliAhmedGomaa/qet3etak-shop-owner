<section class="login safe-area-page" dir="rtl">
  <div class="login__top">
    <a class="login__back" routerLink="/">{{ branding.branding().appName }}</a>
    <button type="button" class="login__theme" (click)="theme.toggle()">
      {{ theme.theme() === 'dark' ? '☀ فاتح' : '☾ داكن' }}
    </button>
  </div>
  <h1>تسجيل الدخول</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      <span>رقم الجوال</span>
      <input formControlName="phone" type="tel" />
    </label>
    <label>
      <span>كلمة المرور</span>
      <input formControlName="password" type="password" />
    </label>
    @if (error()) {
      <p class="err">{{ error() }}</p>
    }
    <button type="submit" [disabled]="submitting()">دخول</button>
  </form>
  <a routerLink="/register">إنشاء حساب تاجر</a>
</section>
